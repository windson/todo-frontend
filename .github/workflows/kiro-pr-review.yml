name: Kiro PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  repository_dispatch:
    types: [kiro-pr-review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: kiro-pr-review-${{ github.event.pull_request.number || github.event.client_payload.pr_number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.client_payload.pr_number || inputs.pr_number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid pull request number: ${process.env.PR_NUMBER}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('number', String(prNumber));
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_ref', pr.head.ref);

      - name: Check out trusted review automation
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out pull request as review target
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          path: review-target
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare review context
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git -C review-target cat-file -e "$BASE_SHA^{commit}"
          mkdir -p .kiro/review-input
          git -C review-target diff --find-renames --unified=80 "$BASE_SHA...$HEAD_SHA" -- > .kiro/review-input/pr.diff
          git -C review-target diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" -- \
            | sed 's#^#review-target/#' > .kiro/review-input/changed-files.txt
          {
            echo "Repository: $REPOSITORY"
            echo "Pull request: #$PR_NUMBER"
            echo "Base: $BASE_REF ($BASE_SHA)"
            echo "Head: $HEAD_REF ($HEAD_SHA)"
            echo "Source root: review-target/"
            echo
            echo "Changed files:"
            cat .kiro/review-input/changed-files.txt
          } > .kiro/review-input/context.md

      - name: Install Kiro CLI
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://cli.kiro.dev/install | bash
          "$HOME/.local/bin/kiro-cli" --version

      - name: Run Kiro review
        id: kiro
        continue-on-error: true
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
          KIRO_LOG_NO_COLOR: "1"
          NO_COLOR: "1"
          TERM: dumb
        run: |
          set -euo pipefail
          if [[ -z "$KIRO_API_KEY" ]]; then
            echo "KIRO_API_KEY is not configured" >&2
            exit 2
          fi

          set +e
          "$HOME/.local/bin/kiro-cli" chat \
            --v2 \
            --agent pr-reviewer \
            --no-interactive \
            --output-format stream-json \
            --trust-tools=fs_read,grep \
            "Review this pull request and return the required KIRO_REVIEW_JSON payload." \
            > "$RUNNER_TEMP/kiro-review.jsonl" 2>&1
          cli_status=$?
          set -e

          echo "exit_code=$cli_status" >> "$GITHUB_OUTPUT"
          python3 .github/scripts/extract-kiro-review.py \
            "$RUNNER_TEMP/kiro-review.jsonl" \
            .kiro/review-input/pr.diff \
            "$RUNNER_TEMP/kiro-review.json" \
            --exit-code "$cli_status"

      - name: Generate reviewer bot token
        id: reviewer-token
        if: steps.kiro.outcome == 'success'
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.KIRO_REVIEWER_CLIENT_ID }}
          private-key: ${{ secrets.KIRO_REVIEWER_PRIVATE_KEY }}

      - name: Create inline review comments
        if: steps.kiro.outcome == 'success' && steps.pr.outputs.number != ''
        uses: actions/github-script@v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          github-token: ${{ steps.reviewer-token.outputs.token }}
          script: |
            const fs = require('fs');
            const marker = '<!-- kiro-inline-review -->';
            const reviewPath = `${process.env.RUNNER_TEMP}/kiro-review.json`;
            const { findings } = JSON.parse(fs.readFileSync(reviewPath, 'utf8'));
            const prNumber = Number(process.env.PR_NUMBER);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const existing = await github.paginate(github.rest.pulls.listReviewComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });
            const stale = existing.filter(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );

            if (findings.length > 0) {
              const comments = findings.map((finding) => ({
                path: finding.path,
                line: finding.line,
                side: 'RIGHT',
                body: `${marker}\n**${finding.severity}: ${finding.title}**\n\n${finding.body}\n\n[Review run](${runUrl})`,
              }));

              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: 'COMMENT',
                comments,
              });
            } else {
              core.notice('Kiro found no actionable findings.');
            }

            for (const comment of stale) {
              await github.rest.pulls.deleteReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
              });
            }

      - name: Require successful Kiro review
        if: steps.kiro.outcome != 'success'
        run: exit 1
