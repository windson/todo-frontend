name: Kiro PR Fixer

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: kiro-pr-fix-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, format('@{0}', vars.KIRO_REVIEWER_LOGIN))
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Authorize and resolve fix command
        id: command
        uses: actions/github-script@v9.0.0
        env:
          BOT_LOGIN: ${{ vars.KIRO_REVIEWER_LOGIN }}
        with:
          script: |
            const marker = '<!-- kiro-inline-review -->';
            const botLogin = process.env.BOT_LOGIN.toLowerCase();
            const expectedBot = `${botLogin}[bot]`;
            const comment = context.payload.comment;
            const escapedLogin = botLogin.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const command = comment.body.trim().match(
              new RegExp(`^@${escapedLogin}\\s+fix\\s+(all|this|discussion_r\\d+)\\s*$`, 'i'),
            );
            if (!command) {
              core.setFailed(`Unsupported command. Use @${botLogin} fix all, fix discussion_r<ID>, or fix this.`);
              return;
            }

            let prNumber;
            if (context.eventName === 'issue_comment') {
              if (!context.payload.issue.pull_request) {
                core.setFailed('Fix commands are only accepted on pull requests.');
                return;
              }
              prNumber = context.payload.issue.number;
            } else {
              prNumber = context.payload.pull_request.number;
            }

            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: comment.user.login,
            });
            if (!['write', 'maintain', 'admin'].includes(permission.permission)) {
              core.setFailed(`${comment.user.login} does not have permission to request code changes.`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (pr.head.repo?.full_name !== pr.base.repo?.full_name) {
              core.setFailed('Automatic fixes are limited to same-repository pull request branches.');
              return;
            }

            const isKiroFinding = (item) =>
              item.user?.login?.toLowerCase() === expectedBot && item.body?.includes(marker);
            let selected;
            const target = command[1].toLowerCase();

            if (target === 'all') {
              const comments = await github.paginate(github.rest.pulls.listReviewComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100,
              });
              selected = comments.filter(
                (item) => isKiroFinding(item) && item.commit_id === pr.head.sha,
              );
            } else {
              let commentId;
              if (target === 'this') {
                if (context.eventName !== 'pull_request_review_comment' || !comment.in_reply_to_id) {
                  core.setFailed('Use "fix this" as a reply to a Kiro inline review comment.');
                  return;
                }
                commentId = comment.in_reply_to_id;
              } else {
                commentId = Number(target.replace('discussion_r', ''));
              }

              const { data: finding } = await github.rest.pulls.getReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
              });
              if (!isKiroFinding(finding) || finding.commit_id !== pr.head.sha) {
                core.setFailed('The selected comment is not a current Kiro finding.');
                return;
              }
              selected = [finding];
            }

            if (selected.length === 0) {
              core.setFailed('No current Kiro findings matched this command.');
              return;
            }
            if (selected.length > 25) {
              core.setFailed('Fix all is limited to 25 findings per run.');
              return;
            }

            const findings = selected.map((item) => ({
              id: item.id,
              path: item.path,
              line: item.line ?? item.original_line,
              body: item.body.replace(marker, '').trim(),
              url: item.html_url,
            }));

            core.setOutput('authorized', 'true');
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('findings', JSON.stringify(findings));

      - name: Generate reviewer bot token
        id: reviewer-token
        if: steps.command.outputs.authorized == 'true'
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ vars.KIRO_REVIEWER_APP_ID }}
          private-key: ${{ secrets.KIRO_REVIEWER_PRIVATE_KEY }}

      - name: Check out trusted automation
        if: steps.command.outputs.authorized == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out pull request head
        if: steps.command.outputs.authorized == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.command.outputs.head_sha }}
          path: review-target
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare fix request
        if: steps.command.outputs.authorized == 'true'
        uses: actions/github-script@v9.0.0
        env:
          FINDINGS_JSON: ${{ steps.command.outputs.findings }}
          PR_NUMBER: ${{ steps.command.outputs.pr_number }}
          HEAD_SHA: ${{ steps.command.outputs.head_sha }}
        with:
          script: |
            const fs = require('fs');
            fs.mkdirSync('.kiro/fix-input', { recursive: true });
            fs.writeFileSync(
              '.kiro/fix-input/request.json',
              JSON.stringify({
                pullRequest: Number(process.env.PR_NUMBER),
                headSha: process.env.HEAD_SHA,
                findings: JSON.parse(process.env.FINDINGS_JSON),
              }, null, 2),
            );

      - name: Install Kiro CLI
        if: steps.command.outputs.authorized == 'true'
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://cli.kiro.dev/install | bash
          "$HOME/.local/bin/kiro-cli" --version

      - name: Generate and apply Kiro fix
        if: steps.command.outputs.authorized == 'true'
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
          KIRO_LOG_NO_COLOR: "1"
          NO_COLOR: "1"
          TERM: dumb
        run: |
          set -euo pipefail
          if [[ -z "$KIRO_API_KEY" ]]; then
            echo "KIRO_API_KEY is not configured" >&2
            exit 2
          fi

          set +e
          "$HOME/.local/bin/kiro-cli" chat \
            --v2 \
            --agent pr-fixer \
            --no-interactive \
            --output-format stream-json \
            --trust-tools=fs_read,grep \
            "Prepare exact edits for the authorized findings in .kiro/fix-input/request.json." \
            > "$RUNNER_TEMP/kiro-fix.jsonl" 2>&1
          cli_status=$?
          set -e

          python3 .github/scripts/apply-kiro-fix.py \
            "$RUNNER_TEMP/kiro-fix.jsonl" \
            review-target \
            --exit-code "$cli_status"

      - name: Validate proposed changes
        if: steps.command.outputs.authorized == 'true'
        run: |
          set -euo pipefail
          git -C review-target diff --check
          if git -C review-target diff --quiet; then
            echo "Kiro produced no code changes" >&2
            exit 1
          fi
          git -C review-target diff --stat

      - name: Commit fix to pull request branch
        if: steps.command.outputs.authorized == 'true'
        env:
          APP_TOKEN: ${{ steps.reviewer-token.outputs.token }}
          EXPECTED_HEAD_SHA: ${{ steps.command.outputs.head_sha }}
          HEAD_REF: ${{ steps.command.outputs.head_ref }}
          PR_NUMBER: ${{ steps.command.outputs.pr_number }}
          BOT_LOGIN: ${{ vars.KIRO_REVIEWER_LOGIN }}
          APP_ID: ${{ vars.KIRO_REVIEWER_APP_ID }}
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token }}
        run: |
          set -euo pipefail
          current_head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          if [[ "$current_head" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "The pull request changed while Kiro was preparing the fix" >&2
            exit 1
          fi

          git -C review-target config user.name "$BOT_LOGIN[bot]"
          git -C review-target config user.email "$APP_ID+$BOT_LOGIN[bot]@users.noreply.github.com"
          git -C review-target add -u
          git -C review-target commit -m "fix: address Kiro review findings"
          git -C review-target push \
            "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${HEAD_REF}"
