AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  todo-frontend CI/CD: an encrypted, TLS-only, public-access-blocked S3 artifact
  bucket (with a terminal access-log bucket); a CodeBuild project that runs
  infra/buildspec.yml (bun install -> bun run build with VITE_API_URL baked at
  build time -> zip dist/ + server.mjs + package.json -> aws s3 cp); and a
  CodeDeploy application (ComputePlatform Lambda) with least-privilege roles.
  This is NOT an automated pipeline: there is no AWS::CodePipeline and no
  CodeDeploy DeploymentGroup. The CodeDeploy application is a placeholder for a
  future classic-AWS::Lambda::Function path; the Web Function cutover is a
  CloudFormation update to WebFunctionEndpoint RevisionWeights in app.yaml, and
  the build-to-cutover handoff is manual (see infra/README.md "Build and
  cutover"). No plaintext secrets: VITE_API_URL is a public build-time config
  value (the backend endpoint URL), not a secret.

Parameters:
  SourceRepositoryUrl:
    Type: String
    Default: "https://github.com/windson/todo-frontend.git"
    Description: Git source cloned by CodeBuild.
  SourceBranch:
    Type: String
    Default: "feat/aws-iac-cicd"
    Description: Git branch CodeBuild builds from.
  ViteApiUrl:
    Type: String
    Default: "https://example.execute-api.amazonaws.com/api"
    Description: >-
      The backend API base URL baked into the SPA at build time (the backend
      Lambda Web Function endpoint HTTPS URL + /api). This is a public config
      value embedded in client-side assets, NOT a secret.

Resources:
  ArtifactKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "KMS key for ${AWS::StackName} build artifacts."
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRootAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  # Server-access log bucket for the artifact bucket (S3_BUCKET_LOGGING_ENABLED).
  # It does not log to itself (that would recurse); standard terminal log-bucket.
  AccessLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-logs
            Status: Enabled
            ExpirationInDays: 90

  AccessLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt AccessLogBucket.Arn
              - !Sub "${AccessLogBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"
          - Sid: AllowS3LogDelivery
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: "s3:PutObject"
            Resource: !Sub "${AccessLogBucket.Arn}/*"

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref ArtifactKmsKey
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogBucket
        LogFilePrefix: artifact-access/
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-noncurrent
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # Deny any non-TLS access to the bucket (cfn-guard S3 secure-transport rule).
  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  CodeBuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${AWS::StackName}"
      RetentionInDays: 365

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${CodeBuildLogGroup.Arn}:*"
        - PolicyName: artifacts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt ArtifactBucket.Arn
              - Effect: Allow
                Action:
                  - kms:GenerateDataKey
                  - kms:Decrypt
                Resource: !GetAtt ArtifactKmsKey.Arn

  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-build"
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source:
        Type: GITHUB
        Location: !Ref SourceRepositoryUrl
        BuildSpec: infra/buildspec.yml
      SourceVersion: !Ref SourceBranch
      Artifacts:
        Type: NO_ARTIFACTS
      EncryptionKey: !GetAtt ArtifactKmsKey.Arn
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref CodeBuildLogGroup
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        # Only the specific variables each build step needs are declared here.
        # The buildspec never dumps the full environment (no printenv/env/set).
        # VITE_API_URL is a public build-time value baked into dist/, not a secret.
        EnvironmentVariables:
          - Name: ARTIFACT_BUCKET
            Type: PLAINTEXT
            Value: !Ref ArtifactBucket
          - Name: VITE_API_URL
            Type: PLAINTEXT
            Value: !Ref ViteApiUrl

  CodeDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSCodeDeployRoleForLambda"

  # PLACEHOLDER (intentional): this CodeDeploy application has no
  # DeploymentGroup and does NOT perform the Web Function cutover. Lambda Web
  # Functions shift traffic natively via WebFunctionEndpoint RevisionWeights
  # (see app.yaml), which classic CodeDeploy Lambda deployment groups -- which
  # act on alias versions of a traditional AWS::Lambda::Function -- cannot
  # drive. It is kept to reserve a CodeDeploy path for a future classic-Lambda
  # migration. See infra/README.md "Why there is no CodeDeploy DeploymentGroup".
  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub "${AWS::StackName}-app"
      ComputePlatform: Lambda

Outputs:
  ArtifactBucketName:
    Description: Name of the build artifact bucket.
    Value: !Ref ArtifactBucket
    Export:
      Name: !Sub "${AWS::StackName}-ArtifactBucketName"
  ArtifactKmsKeyArn:
    Description: ARN of the artifact KMS key.
    Value: !GetAtt ArtifactKmsKey.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ArtifactKmsKeyArn"
  CodeBuildProjectName:
    Description: Name of the CodeBuild project.
    Value: !Ref CodeBuildProject
    Export:
      Name: !Sub "${AWS::StackName}-CodeBuildProjectName"
  CodeDeployApplicationName:
    Description: Name of the CodeDeploy application.
    Value: !Ref CodeDeployApplication
    Export:
      Name: !Sub "${AWS::StackName}-CodeDeployApplicationName"
